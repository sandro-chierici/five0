  kafka:
    image: apache/kafka:latest
    container_name: ore-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: exit 0
      interval: 3s
      timeout: 1s
      retries: 10         
    networks:
      - ore-network


  # ============================================================================
  # Kafka Single Broker (KRaft Mode - No Zookeeper)
  # ============================================================================
  
  # kafka:
  #   image: apache/kafka:3.7.0
  #   container_name: ore-kafka
  #   hostname: kafka
  #   ports:
  #     - "9092:9092"
  #     - "9093:9093"
  #   environment:
  #     KAFKA_NODE_ID: 1
  #     KAFKA_PROCESS_ROLES: 'broker,controller'
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
  #     KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
  #     KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
  #     KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  #     KAFKA_LOG_DIRS: '/var/lib/kafka/data'
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #     CLUSTER_ID: 'ORE-Kafka-Cluster-2026'
  #     KAFKA_LOG_RETENTION_HOURS: 1
  #     KAFKA_COMPRESSION_TYPE: 'lz4'
  #   volumes:
  #     - kafka-data:/var/lib/kafka/data
  #   networks:
  #     - ore-network

  # Kafka UI (Optional - for monitoring and debugging)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ore-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ore-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
          condition: service_healthy  
    networks:
      - ore-network

  # ============================================================================
  # Redis - Session Cache
  # ============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: ore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - ore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # MinIO - Object Storage
  # ============================================================================
  
  minio:
    image: minio/minio:latest
    container_name: ore-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO Client - Initialize buckets
  minio-init:
    image: minio/mc:latest
    container_name: ore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/ore-frames --ignore-existing;
      mc mb myminio/ore-models --ignore-existing;
      mc ilm add myminio/ore-frames --expiry-days 1 --noncurrent-expire-days 1 || true;
      echo 'MinIO buckets initialized successfully';
      exit 0;
      "
    networks:
      - ore-network

  # ============================================================================
  # Object Recognition Gateway (Go Service)
  # ============================================================================
  
  ore-gateway:
    build:
      context: ./ore-gateway
      dockerfile: Dockerfile
    container_name: ore-gateway
    ports:
      - "8080:8080"    # HTTP/WebSocket
    environment:
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_USE_SSL: "false"
      LOG_LEVEL: "info"
      HTTP_PORT: "8080"
    depends_on:
      kafka:
          condition: service_healthy      
    networks:
      - ore-network
    restart: unless-stopped

