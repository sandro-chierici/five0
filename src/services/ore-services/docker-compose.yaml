  #   restart: unless-stopped

  # ============================================================================
  # GPU Version (Commented out - uncomment when GPU is available)
  # ============================================================================
  
  ore-engine-gpu:
    build:
      context: ./ore-engine
      dockerfile: Dockerfile
      target: gpu
    container_name: ore-engine-gpu-1
    environment:
      KAFKA_BROKERS: "kafka:9092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_USE_SSL: "false"
      DEVICE: "cuda"
      LOG_LEVEL: "INFO"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      kafka:
          condition: service_healthy
    networks:
      - ore-network          
    restart: unless-stopped


# ============================================================================
# Volumes
# ============================================================================

volumes:
  kafka-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local        

# ============================================================================
# Networks
# ============================================================================

networks:
  ore-network:
    driver: bridge
    name: ore-network
